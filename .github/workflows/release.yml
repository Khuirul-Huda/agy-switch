name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            "linux amd64 agy-switch-linux-amd64" \
            "linux arm64 agy-switch-linux-arm64" \
            "darwin amd64 agy-switch-darwin-amd64" \
            "darwin arm64 agy-switch-darwin-arm64" \
            "windows amd64 agy-switch-windows-amd64.exe"; do
            read -r goos goarch output <<<"${target}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "dist/${output}" .
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true

